<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Công Thức Toán Học - Web Tĩnh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cấu hình MathJax để render công thức từ LaTeX -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-8 font-sans">

    <div class="max-w-2xl mx-auto space-y-6">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-600">Trợ Lý Đọc Toán Học</h1>
            <p class="text-sm text-slate-500 mt-2">Giải pháp chạy hoàn toàn trên GitHub Pages (Web Speech API)</p>
        </div>

        <!-- Mẫu 1: Câu hỏi phân số -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div class="flex-1">
                <p class="font-semibold mb-2">Câu 1: Tính giá trị biểu thức sau:</p>
                <div class="text-lg" data-latex="x = \frac{-b + \sqrt{b^2 - 4ac}}{2a}">
                    $$ x = \frac{-b + \sqrt{b^2 - 4ac}}{2a} $$
                </div>
            </div>
            <button onclick="readMath(this)" class="ml-4 p-3 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 hover:scale-105 transition-all shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2l4 4V4L9 8H7a2 2 0 00-2 2z"></path></svg>
            </button>
        </div>

        <!-- Mẫu 2: Câu hỏi tích phân -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div class="flex-1">
                <p class="font-semibold mb-2">Câu 2: Giải tích phân:</p>
                <div class="text-lg" data-latex="\int_{0}^{1} x^3 + 2x dx">
                    $$ \int_{0}^{1} x^3 + 2x dx $$
                </div>
            </div>
            <button onclick="readMath(this)" class="ml-4 p-3 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 hover:scale-105 transition-all shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2l4 4V4L9 8H7a2 2 0 00-2 2z"></path></svg>
            </button>
        </div>
    </div>

<script>
    // 1. BỘ TỪ ĐIỂN DỊCH LATEX SANG TIẾNG VIỆT
    function translateLatexToVietnamese(latex) {
        let text = latex;
        
        // Cấu trúc phân số: \frac{A}{B} -> phân số A phần B
        text = text.replace(/\\frac{([^{}]+)}{([^{}]+)}/g, " phân số $1 phần $2 ");
        
        // Cấu trúc căn bậc hai: \sqrt{A} -> căn bậc hai của A
        text = text.replace(/\\sqrt{([^{}]+)}/g, " căn bậc hai của $1 ");
        
        // Cấu trúc tích phân: \int_{A}^{B} -> tích phân từ A đến B của
        text = text.replace(/\\int_{([^{}]+)}\^{([^{}]+)}/g, " tích phân từ $1 đến $2 của ");
        
        // Số mũ phổ biến
        text = text.replace(/\^2/g, " bình phương ");
        text = text.replace(/\^3/g, " lập phương ");
        text = text.replace(/\^{([^{}]+)}/g, " mũ $1 ");
        
        // Các phép toán cơ bản
        text = text.replace(/\+/g, " cộng ");
        text = text.replace(/-/g, " trừ ");
        text = text.replace(/=/g, " bằng ");
        text = text.replace(/\\times/g, " nhân ");
        text = text.replace(/\\div/g, " chia ");
        text = text.replace(/</g, " nhỏ hơn ");
        text = text.replace(/>/g, " lớn hơn ");
        
        // Loại bỏ các ký tự thừa của LaTeX
        text = text.replace(/\\/g, " "); 
        text = text.replace(/[{}]/g, " "); 
        
        // Chuẩn hóa khoảng trắng
        return text.replace(/\s+/g, ' ').trim();
    }

    // 2. HÀM GỌI WEB SPEECH API (Đọc giọng nói của trình duyệt)
    function speakText(text) {
        // Hủy các giọng đọc đang dang dở
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN'; // Giọng tiếng Việt
        utterance.rate = 0.9;     // Tốc độ đọc (0.1 đến 10)
        utterance.pitch = 1.0;    // Độ cao giọng đọc
        
        window.speechSynthesis.speak(utterance);
    }

    // 3. HÀM XỬ LÝ KHI BẤM NÚT "ĐỌC"
    function readMath(buttonElement) {
        // Lấy thẻ chứa công thức nằm cùng cấp với nút bấm
        const mathContainer = buttonElement.previousElementSibling.querySelector('[data-latex]');
        if (!mathContainer) return;

        // Lấy mã LaTeX gốc từ thuộc tính data-latex
        const rawLatex = mathContainer.getAttribute('data-latex');
        
        // Dịch sang câu văn tiếng Việt
        const speakableText = translateLatexToVietnamese(rawLatex);
        
        // Phát hiệu ứng nhấp nháy cho nút (tùy chọn UI)
        buttonElement.classList.add('bg-indigo-600', 'text-white');
        setTimeout(() => buttonElement.classList.remove('bg-indigo-600', 'text-white'), 1500);

        // Bắt đầu đọc
        speakText(speakableText);
    }
</script>
</body>
</html>
